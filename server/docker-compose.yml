# ScribeDog Server Edition: one ScribeDog instance behind Caddy (HTTPS).
#
# Quick start:
#   cp .env.example .env                  # password and the site address at least
#   mkdir -p scribedog-data               # your notes live here, as plain .md files
#   docker compose run --rm certificates  # this installation's certificate, once
#   docker compose up -d --build
#   open https://<site address>/          (or https://<host>/<base path>/)
#
# See docs/getting-started.md, docs/certificates.md and docs/configuration.md.

services:
  scribedog:
    build:
      # The image needs the shared frontend from the repository root, see Dockerfile.
      context: ..
      dockerfile: server/Dockerfile
    # Built locally by default. To run a published image instead, put
    # SCRIBEDOG_IMAGE=ghcr.io/snooky234/scribedog-server:<version> in .env and
    # use `docker compose pull` (see README, "Updating").
    image: ${SCRIBEDOG_IMAGE:-scribedog-server:0.27.1}
    restart: unless-stopped
    environment:
      # User and group the server runs as inside the container. The container
      # starts as root, hands ./scribedog-data to these ids and then drops to
      # them, so a folder Compose created itself works without any chown.
      # Match them to your own user (`id -u` / `id -g`) so the notes stay
      # yours on the host; 1000 is the usual first user.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Only used until a password exists in the data folder; remove afterwards.
      SCRIBEDOG_INIT_PASSWORD: ${SCRIBEDOG_INIT_PASSWORD:-}
      # Empty = app at "/". Set e.g. "/anna" to run under a path prefix.
      SCRIBEDOG_BASE_PATH: ${SCRIBEDOG_BASE_PATH:-}
      # Empty = the built-in cloud providers. See .env.example.
      SCRIBEDOG_LLM_ALLOWED_HOSTS: ${SCRIBEDOG_LLM_ALLOWED_HOSTS:-}
      # Empty = "{doc} - ScribeDog". See .env.example.
      SCRIBEDOG_TITLE_FORMAT: ${SCRIBEDOG_TITLE_FORMAT:-}
      # Empty = the ScribeDog icon. A path inside the container, see the
      # commented volume below.
      SCRIBEDOG_FAVICON: ${SCRIBEDOG_FAVICON:-}
    volumes:
      # A bind mount on purpose: the notes are ordinary files in an ordinary
      # folder, readable and backed up with any tool you already use.
      - ./scribedog-data:/data
      # Your own tab icon: remove the # and set SCRIBEDOG_FAVICON=/favicon.png
      # in .env (keep the extension: .svg, .png or .ico).
      #- ./favicon.png:/favicon.png:ro
    expose:
      - "3000"

  # Creates ./certs (CA and server certificate) with scripts/make-certs.mjs.
  # Not part of `up`; run it on its own, once and again to renew:
  #   docker compose run --rm certificates                (SCRIBEDOG_SITE_ADDRESS)
  #   docker compose run --rm certificates 192.168.1.50 nas.fritz.box
  # The script ships in the ScribeDog image (scripts/make-certs.mjs), so it
  # always matches the version that uses its files.
  certificates:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: ${SCRIBEDOG_IMAGE:-scribedog-server:0.27.1}
    profiles: ["tools"]
    network_mode: none
    environment:
      SCRIBEDOG_SITE_ADDRESS: ${SCRIBEDOG_SITE_ADDRESS:-localhost}
      # The new files are handed to this user, the key stays root's.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./certs:/certs
    entrypoint: ["node", "scripts/make-certs.mjs", "--out", "/certs"]

  # Stops `docker compose up` with an explanation when the certificate is
  # missing (or .env still asks for Caddy's own CA, which is gone), instead
  # of a Caddy that fails and restarts in the background. Read its message
  # with `docker compose logs certificate-check`.
  certificate-check:
    image: caddy:2-alpine
    restart: "no"
    network_mode: none
    environment:
      SCRIBEDOG_TLS: ${SCRIBEDOG_TLS:-}
    volumes:
      - ./certs:/certs:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        docs=https://github.com/snooky234/scribedog/blob/main/server/docs
        case "$$SCRIBEDOG_TLS" in
          "") ;;
          internal)
            echo "ScribeDog: SCRIBEDOG_TLS=internal (Caddy's own CA) is no longer supported."
            echo "Set SCRIBEDOG_TLS= (empty) in .env, then: docker compose run --rm certificates"
            echo "Step by step: $$docs/upgrading-certificates.md"
            exit 1 ;;
          *) exit 0 ;;
        esac
        for file in ca.crt server.crt server.key; do
          if [ ! -s "/certs/$$file" ]; then
            echo "ScribeDog: there is no certificate yet (/certs/$$file is missing)."
            echo "Create it once with: docker compose run --rm certificates"
            echo "Then: docker compose up -d. Details: $$docs/certificates.md"
            exit 1
          fi
        done

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      scribedog:
        condition: service_started
      certificate-check:
        condition: service_completed_successfully
    ports:
      - "${SCRIBEDOG_HTTP_PORT:-80}:80"
      - "${SCRIBEDOG_HTTPS_PORT:-443}:443"
      - "${SCRIBEDOG_HTTPS_PORT:-443}:443/udp"
    environment:
      # Hostname or IP the site answers on. "localhost" for a first test on
      # the Docker host itself; the LAN name/IP of the box for the home network;
      # a real domain for Let's Encrypt.
      SCRIBEDOG_SITE_ADDRESS: ${SCRIBEDOG_SITE_ADDRESS:-localhost}
      # Which site's certificate answers a client that names none, i.e. a
      # browser opening the app by IP address. The site address itself unless
      # that is a list; then set it to the address the phones use.
      SCRIBEDOG_DEFAULT_SNI: ${SCRIBEDOG_DEFAULT_SNI:-${SCRIBEDOG_SITE_ADDRESS:-localhost}}
      # Empty = the certificate in ./certs (docker compose run --rm
      # certificates). For a public domain set your e-mail address and Caddy
      # fetches a Let's Encrypt certificate instead.
      SCRIBEDOG_TLS: ${SCRIBEDOG_TLS:-/certs/server.crt /certs/server.key}
      # The HTTP port redirects here; it has to know the port on the host.
      SCRIBEDOG_HTTPS_PORT: ${SCRIBEDOG_HTTPS_PORT:-443}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Read-only and never part of an image: the server key stays in this
      # folder on the host.
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
