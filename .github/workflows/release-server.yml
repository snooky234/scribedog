name: Release server image

# The server edition ships as a container image rather than an installer, but
# it carries the same version as the app (the web client is the app's own
# frontend), so it rides on the same tag as the desktop release.
#
# Only exact versions are published: no "latest", no moving major/minor tags.
# An operator pins one version, and an upgrade is a deliberate edit of the
# compose file, which is also what makes the data-version downgrade check in
# the server meaningful.
#
# Each architecture builds on a runner of its own architecture and pushes an
# untagged image addressed only by digest; the merge job then joins those
# digests into one manifest list under the version tag. The tag therefore
# appears in the registry only once both halves are in, and it never points at
# a half-published image.
#
# This replaces a single QEMU-emulated buildx run. Emulated arm64 was the one
# recurring failure of this pipeline: `npm ci` in the web stage died with
# "qemu: uncaught target signal 4 (Illegal instruction)", and the build then
# sat on that layer until a timeout killed it — twice in a row on v0.16.0,
# first attempt and retry, which is what the retry step could never fix,
# because a layer aborted by a timeout never enters the cache. Building
# natively removes the emulator, and with it the crash, the retry step and the
# timeouts that went with it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and push, e.g. 0.11.0'
        required: true

# A tag pushed twice starts a second build of the very same image tag, and the
# two then race on the registry push — which is how the v0.14.1 run sat there
# for 99 minutes before it was cancelled. Cancelling is safe here (unlike in
# release.yml): a build pushes by digest and the tag is only written by the
# merge job at the very end, so an aborted run leaves nothing half-published
# behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/scribedog-server

jobs:
  # Resolved once rather than per architecture: the two build jobs must agree
  # on the version, and the manifest-versus-tag check should fail the run
  # before any runner starts building.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          manifest=$(node -p "require('./package.json').version")

          if [ "$version" != "$manifest" ]; then
            echo "Tag says $version but package.json says $manifest; bump the manifests first." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            # Used in artifact names, where a slash is not allowed.
            arch: amd64
          # arm64 is not an afterthought here: a Raspberry Pi is the typical
          # box this runs on. Native arm runners are free for public
          # repositories, which is what makes dropping QEMU possible.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # Pushing to ghcr.io as the repository itself; no secret needed for it.
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pushed to ghcr only, without a tag: the output carries just a digest,
      # and the merge job below is what gives it a name. Docker Hub is not fed
      # here too — with two --output targets on one push-by-digest build,
      # buildx reports back only one of the two digests (found the hard way:
      # it surfaced as "image.name: docker.io/..." while the ghcr half was
      # silently missing, and the merge job below failed with ghcr's digest
      # "not found" because it was never exported). The merge job instead
      # mirrors the finished ghcr manifest list to Docker Hub, which needs
      # only one digest per registry to begin with.
      - name: Build and push by digest
        id: build
        # A native build of both stages takes a few minutes; this is a
        # backstop against a hung runner, not the 20 minutes the emulated
        # build needed.
        timeout-minutes: 30
        uses: docker/build-push-action@v7
        with:
          # The whole repository: the image needs the frontend under /src as
          # well as /server (see server/Dockerfile).
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per architecture: the two jobs would otherwise overwrite
          # each other's cache, since type=gha keys on the workflow alone.
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}

      # The digest is the only thing the merge job needs from this runner, and
      # an artifact is how it crosses the job boundary.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "Build produced no digest; nothing to hand to the merge job." >&2
            exit 1
          fi
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Writes the version tag, in both registries, pointing at a manifest list
  # that holds both architectures. Runs only once both builds succeeded, so a
  # failed architecture means no tag at all rather than a single-arch image
  # under a name operators expect to be multi-arch.
  merge:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create ghcr manifest list
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # One digest file per architecture; anything else means a build job
          # pushed something unexpected.
          count=$(ls -1 | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "Expected 2 digests (amd64, arm64), found $count." >&2
            ls -la >&2
            exit 1
          fi

          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:${VERSION}" \
            $(printf "${GHCR_IMAGE}@sha256:%s " *)

      # Docker Hub gets the same manifest list by reference rather than a
      # second digest build (see the comment on "Build and push by digest"
      # above for why): imagetools copies each platform's image as-is, so the
      # two registries end up byte-identical.
      - name: Mirror manifest list to Docker Hub
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/scribedog-server
        run: |
          docker buildx imagetools create \
            --tag "${DOCKERHUB_IMAGE}:${VERSION}" \
            "${GHCR_IMAGE}:${VERSION}"

      - name: Verify manifest lists
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/scribedog-server
        run: |
          # A tag that resolves to a single architecture would only surface on
          # an operator's Raspberry Pi, so it is checked here instead. Read as
          # JSON rather than grepped: the index also lists attestation
          # manifests, which carry architecture "unknown" and must not count.
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            echo "== ${image}:${VERSION}"
            docker buildx imagetools inspect "${image}:${VERSION}"

            archs=$(docker buildx imagetools inspect --raw "${image}:${VERSION}" \
              | jq -r '[.manifests[].platform | select(.architecture != "unknown")
                        | "\(.os)/\(.architecture)"] | sort | join(",")')

            if [ "$archs" != "linux/amd64,linux/arm64" ]; then
              echo "${image}:${VERSION} should carry linux/amd64 and linux/arm64, got: ${archs:-none}" >&2
              exit 1
            fi
          done
